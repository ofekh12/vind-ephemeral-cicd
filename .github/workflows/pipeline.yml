name: DevOps Delivery Pipeline

on:
  push:
    branches: [ main, dev ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

     
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          # יצירת תג דינמי (למשל dev-sha או main-sha)
          TAG="${{ github.ref_name }}-${{ github.sha }}"
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      - name: Install vcluster
        run: |
          # הורדת ה-CLI הרשמי של vcluster
          curl -L -o vcluster "https://github.com/loft-sh/vcluster/releases/latest/download/vcluster-linux-amd64"
          chmod +x vcluster
          sudo mv vcluster /usr/local/bin/
          
          # יצירת קלאסטר וירטואלי (זה עושה בדיוק את מה ש-vind היה אמור לעשות)
          # אנחנו משתמשים ב-k3s כ-distro כי הוא הכי קל ל-CI
          vcluster create my-vcluster --connect=false

      - name: Deploy with Helm
        run: |
          helm dependency update ./my-app-chart
          helm install my-app ./my-app-chart \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ env.IMAGE_TAG }} \
            --wait --timeout 5m

      - name: Validation Test
        run: |
          echo "Waiting for application to be ready..."
          
          ATTEMPTS=0
          MAX_ATTEMPTS=15
          until curl -s http://localhost:30001 | grep "200 OK"; do
            echo "Waiting... ($ATTEMPTS/$MAX_ATTEMPTS)"
            sleep 10
            ATTEMPTS=$((ATTEMPTS+1))
            if [ $ATTEMPTS -eq $MAX_ATTEMPTS ]; then
              echo "App failed to start!"
              exit 1
            fi
          done
          echo "Success! Application is up."